<!DOCTYPE html>
<!--
  counter.html: Preact counter with htm and useState

  Description:
  Counter page that builds its markup with htm tagged templates instead of
  JSX and keeps the count in useState.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      Open counter.html in a web browser. There is no compiler or dev server.

  Requirements:
  - A current web browser with ES module support
  - Preact 10 and htm 3, loaded from esm.sh

  Notes:
  - Loading the modules needs network access to esm.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Preact counter</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { h, render } from "https://esm.sh/preact@10";
      import { useState } from "https://esm.sh/preact@10/hooks";
      import htm from "https://esm.sh/htm@3";

      // htm is JSX-shaped syntax as a tagged template: no build step, and
      // `html` produces the same vnodes JSX would.
      const html = htm.bind(h);

      function Counter({ step = 1 }) {
        const [count, setCount] = useState(0);

        return html`
          <p>
            <output>${count}</output>
            <button onClick=${() => setCount(count + step)}>+${step}</button>
            <button onClick=${() => setCount(count - step)}>-${step}</button>
            <button onClick=${() => setCount(0)} disabled=${count === 0}>reset</button>
          </p>
        `;
      }

      render(html`<${Counter} step=${2} />`, document.getElementById("root"));
    </script>
  </body>
</html>
