<!DOCTYPE html>
<!--
  counter.html: React counter page built without JSX

  Description:
  Counter page that loads React and ReactDOM from a CDN and builds elements
  with createElement, so no compiler is needed.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      Open counter.html in a web browser, over a file: URL or any static server.

  Requirements:
  - A current web browser with ES module support
  - React 19 and ReactDOM 19, loaded from esm.sh

  Notes:
  - Loading the modules needs network access to esm.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>React counter</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- JSX would need a compiler, so elements are built with createElement. -->
    <script type="module">
      import { createElement as h, useState } from "https://esm.sh/react@19";
      import { createRoot } from "https://esm.sh/react-dom@19/client";

      function Counter({ step = 1 }) {
        const [count, setCount] = useState(0);

        return h(
          "p",
          null,
          h("output", null, count),
          " ",
          // The updater form takes the previous state, so repeated clicks
          // do not read a stale value.
          h("button", { onClick: () => setCount((c) => c + step) }, `+${step}`),
          h("button", { onClick: () => setCount((c) => c - step) }, `-${step}`),
          h("button", { onClick: () => setCount(0), disabled: count === 0 }, "reset"),
        );
      }

      createRoot(document.getElementById("root")).render(h(Counter, { step: 2 }));
    </script>
  </body>
</html>
