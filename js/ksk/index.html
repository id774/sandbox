<!DOCTYPE html>
<!--
  index.html: Page that converts kana once a second

  Description:
  Provide a text area and run ksk from ksk.js once a second.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      Open index.html in a browser.

  Requirements:
  - A web browser
-->
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>ksk</title>
    <script src="ksk.js"></script>
  </head>
  <body onload="javascript:setInterval(ksk,1000)">
    <textarea style="width: 100%; height: 600px; font-size: 3em;" id="txt"></textarea>
    <div id="debug">
    </div>
  </body>
</html>
