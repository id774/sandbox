<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Lit elements</title>

    <!-- An import map lets the modules below use bare specifiers ("lit")
         without a bundler. -->
    <script type="importmap">
      {
        "imports": {
          "lit": "https://esm.sh/lit@3",
          "lit/": "https://esm.sh/lit@3/"
        }
      }
    </script>

    <script type="module" src="./counter-element.js"></script>
    <script type="module" src="./todo-list.js"></script>
    <script type="module" src="./clock-element.js"></script>
  </head>
  <body>
    <h1>Lit</h1>

    <!-- Custom elements: attributes in, events out, same as a built-in -->
    <my-counter step="2"></my-counter>
    <todo-list heading="Today"></todo-list>
    <my-clock></my-clock>

    <p>last counter value: <span id="log">-</span></p>

    <script type="module">
      document.querySelector("my-counter").addEventListener("count-changed", (event) => {
        document.getElementById("log").textContent = event.detail.value;
      });
    </script>
  </body>
</html>
