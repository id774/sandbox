<!DOCTYPE html>
<!--
  index.html: Scatter plot from coordinate pairs with d3

  Description:
  Draw circles from [x, y] pairs with radii derived from the data.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open plot-chart/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
  </head>
  <body>
    <h1>D3.js</h1>
    <script type="text/javascript">

    var w = 500;
    var h = 100;

    var dataset = [
       [5, 20], [480, 90], [250, 50], [100, 33], [330, 95],
       [410, 12], [475, 44], [25, 67], [85, 21], [220, 88]
    ];

    var svg = d3.select("body")
          .append("svg")
          .attr("width", w)
          .attr("height", h);

    svg.selectAll("circle")
          .data(dataset)
          .enter()
          .append("circle")
          .attr("cx", function(d) {
             return d[0];
          })
          .attr("cy", function(d) {
             return d[1];
          })
          .attr("r", function(d) {
             return Math.sqrt(h - d[1]);
          });

    svg.selectAll("text")
          .data(dataset)
          .enter()
          .append("text")
          .text(function(d) {
             return d[0] + "," + d[1];
          })
          .attr("x", function(d) {
             return d[0];
          })
          .attr("y", function(d) {
             return d[1];
          })
          .attr("font-family", "sans-serif")
          .attr("font-size", "11px")
          .attr("fill", "red");

    </script>
  </body>
</html>
