<!DOCTYPE html>
<!--
  index.html: Smallest d3 page

  Description:
  Append a paragraph of text to the body with d3.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open simple-d3/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
  </head>
  <body>
    <h1>D3.js</h1>
    <svg id="canvas1" width="500" height="300"></svg>
    <script type="text/javascript">
      d3.select("body").append("p").text("新しいパラグラフ！");
    </script>
  </body>
</html>
