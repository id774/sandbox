<!DOCTYPE html>
<!--
  index.html: Bar chart from div elements with d3

  Description:
  Bind an array to div bars sized with CSS in style.css.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open bar-chart/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <h1>D3.js</h1>
    <script type="text/javascript">
      var dataset = [
        25, 7, 5, 26, 11, 8, 25, 14, 23, 19,
        14, 11, 22, 29, 11, 13, 12, 17, 18, 10,
        24, 18, 25, 9, 3
      ];
      var da = function(d) { return d; };
      var hi = function(d) {
        var barHeight = d * 5;
        return barHeight + "px";
      };
      var rb = function(d) {
        if (d >= 15) {
          return "red";
        } else {
          return "black";
        };
      };
      d3.select("body").selectAll("p")
        .data(dataset)
        .enter()
        .append("div")
        .attr("class", "bar")
        .style("height", hi);
    </script>
  </body>
</html>
