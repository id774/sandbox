<!DOCTYPE html>
<!--
  index.html: d3 data join to paragraphs

  Description:
  Bind an array of numbers to one p element per value, colored by the value.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open data-binding/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
  </head>
  <body>
    <h1>D3.js</h1>
    <svg id="canvas1"></svg>
    <script type="text/javascript">
      var dataset = [5, 10, 15, 20, 25];
      var da = function(d) { return d; };
      var rb = function(d) {
        if (d >= 15) {
          return "red";
        } else {
          return "black";
        };
      };
      d3.select("body").selectAll("p")
        .data(dataset)
        .enter()
        .append("p")
        .text(da)
        .style("color", rb);
    </script>
  </body>
</html>
