<!DOCTYPE html>
<!--
  index.html: Bar chart in SVG with d3

  Description:
  Draw one rect per datum with a fill computed from the value.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open bar-svg-chart/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
  </head>
  <body>
    <h1>D3.js</h1>
    <script type="text/javascript">

    var w = 500;
    var h = 100;
    var barPadding = 1;

    var dataset = [
      5, 10, 13, 19, 21, 25, 22, 18, 15, 13,
      11, 12, 15, 20, 18, 17, 16, 18, 23, 25
    ];

    var svg = d3.select("body")
          .append("svg")
          .attr("width", w)
          .attr("height", h);

    svg.selectAll("rect")
          .data(dataset)
          .enter()
          .append("rect")
          .attr("x", function(d, i) {
            return i * (w / dataset.length);
          })
          .attr("y", function(d) {
            return h - (d * 4);
          })
          .attr("width", w / dataset.length - barPadding)
          .attr("height", function(d) {
            return d * 4;
          })
          .attr("fill", function(d) {
            return "rgb(0, 0, " + (d * 10) + ")";
          });

    svg.selectAll("text")
          .data(dataset)
          .enter()
          .append("text")
          .text(function(d) {
             return d;
          })
          .attr("text-anchor", "middle")
          .attr("x", function(d, i) {
             return i * (w / dataset.length) + (w / dataset.length - barPadding) / 2;
          })
          .attr("y", function(d) {
             return h - (d * 4) + 14;
          })
          .attr("font-family", "sans-serif")
          .attr("font-size", "11px")
          .attr("fill", "white");

    </script>
  </body>
</html>
