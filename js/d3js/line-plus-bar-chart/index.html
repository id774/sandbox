<!DOCTYPE html>
<!--
  index.html: Page for the NVD3 line plus bar chart

  Description:
  Load D3, NVD3, and d3js.my.js, which draws the chart from
  linePlusBarData.json.

  Author: id774 (More info: https://id774.net)
  Source Code: https://github.com/id774/sandbox
  License: The GPL version 3, or LGPL version 3 (Dual License).
  Contact: idnanashi@gmail.com

  Usage:
      python3 -m http.server 8000
      Then open line-plus-bar-chart/index.html through the server.

  Requirements:
  - A web browser
  - D3 3.x at /d3/d3.min.js on the serving host, as js/d3js/README.md
    describes
  - NVD3 at /nvd3/nv.d3.min.js on the serving host
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>D3.js</title>
    <script type="text/javascript" src="/d3/d3.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/nvd3/nv.d3.css" />
    <script type="text/javascript" src="/nvd3/nv.d3.min.js"></script>
  </head>
  <body>
    <h1>D3.js</h1>
    <div id='chart'>
      <svg style='height:500px'> </svg>
    </div>
    <script src="./d3js.my.js"></script>
  </body>
</html>
